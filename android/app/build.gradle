plugins {
    id 'com.android.application'
}

android {
    namespace 'net.rubblekin.client'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'net.rubblekin.client'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('rubblekinVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('rubblekinVersionName').getOrElse('0.1.0-dev')
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        development {
            // Public prototype identity, deliberately unsuitable for store releases.
            // Keeping this key stable lets APK updates retain local worlds.
            storeFile file('../development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.development
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // android-activity compiles its own matching C++ glue; prefab would duplicate it.
    buildFeatures {
        prefab false
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
    sourceSets {
        main.assets.srcDirs += files('../../assets/fonts')
    }
}

dependencies {
    // Align GameActivity's older JDK adapters with AppCompat's merged stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // Must match the bundled glue in android-activity 0.6.1 (Bevy 0.19.1).
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
    testImplementation 'junit:junit:4.13.2'
    // The platform JSON implementation is a stub in local JVM unit tests.
    testImplementation 'org.json:json:20240303'
}
