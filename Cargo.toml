[workspace]
members = ["crates/core", "crates/server", "crates/client", "crates/launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubblekin_core = { path = "crates/core" }
rubblekin_server = { path = "crates/server" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
