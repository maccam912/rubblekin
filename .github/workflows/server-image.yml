name: Server image

on:
  workflow_call:

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Source labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
      - uses: docker/setup-buildx-action@v4
      - name: Test and build natively
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Each native build runs the core/server tests in the Dockerfile.
          # Stage archives only; the caller gates GHCR publication on all checks.
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=docker,dest={0}/server-image-{1}.tar', runner.temp, matrix.arch) || 'type=cacheonly' }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - name: Stage image for gated publication
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: server-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/server-image-${{ matrix.arch }}.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 1
