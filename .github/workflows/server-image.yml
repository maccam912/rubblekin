name: Server image

on:
  workflow_call:

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Source labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test and build natively
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Each native build runs the core/server tests in the Dockerfile.
          # Untagged digests are staged first; neither build can move latest.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - name: Export image digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Pass digest to publication job
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: server-image-publication
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both platforms under the commit tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
      - name: Promote latest without moving it backwards
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Read the labels already present on both native images, including
          # indexes published before this ordering safeguard was introduced.
          latest_commit=''
          if docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' > "$RUNNER_TEMP/latest-image.json" 2> "$RUNNER_TEMP/latest-image.err"; then
            latest_commit=$(jq -er '
              [if has("config") then . else .[] end
               | .config.Labels["org.opencontainers.image.revision"]]
              | unique
              | if length == 1 and (.[0] | type == "string" and test("^[a-f0-9]{40}$"))
                then .[0] else error("latest image must identify one source commit") end
            ' "$RUNNER_TEMP/latest-image.json")
          elif ! grep -Eiq 'manifest unknown|not found' "$RUNNER_TEMP/latest-image.err"; then
            cat "$RUNNER_TEMP/latest-image.err" >&2
            exit 1
          fi

          # A later docs/client-only commit does not block this server build.
          # Compare with the last published server, not simply the branch head.
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          history=$(git rev-list --first-parent "origin/$DEFAULT_BRANCH")
          if ! grep -Fxq "$GITHUB_SHA" <<< "$history"; then
            echo "Keeping latest: $GITHUB_SHA is no longer on the default branch."
          elif [ -z "$latest_commit" ] || ! grep -Fxq "$latest_commit" <<< "$history" || git merge-base --is-ancestor "$latest_commit" "$GITHUB_SHA"; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
            echo "Promoted $GITHUB_SHA to latest."
          else
            echo "Keeping latest at $latest_commit; $GITHUB_SHA cannot move it backwards."
          fi
