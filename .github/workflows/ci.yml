name: Checks and builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional full SHA from main to check and release again (defaults to main head)'
        required: false
        type: string

permissions:
  contents: read

# Keep every main push/manual release. Superseded branch/PR checks can stop.
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: Select commits and builds
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
      client_matrix: ${{ steps.plan.outputs.client_matrix }}
      release_clients: ${{ steps.plan.outputs.release_clients }}
      build_server: ${{ steps.plan.outputs.build_server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Plan without publishing or reserving tags
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT: ${{ inputs.commit }}
        run: python scripts/ci/plan.py --event "$EVENT" --ref "$REF" --before "$BEFORE" --after "$AFTER" --base "$BASE" --commit "$COMMIT"

  checks:
    name: Checks at ${{ matrix.commit }}
    needs: plan
    strategy:
      fail-fast: true
      # A separate inner matrix keeps the existing 64-commit push limit valid.
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    uses: ./.github/workflows/checks.yml
    with:
      commit: ${{ matrix.commit }}

  reserve:
    name: Reserve immutable client tags
    needs: plan
    if: needs.plan.outputs.release_clients == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Reserve refs while the push head is current, alongside checks. This does
      # not build/publish a release; historical workflow edits can need a token.
      - name: Reserve tags before main advances
        env:
          COMMITS: ${{ needs.plan.outputs.commits }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PYTHONPATH: scripts/release
        run: |
          python - <<'PY'
          import json
          import os
          from publish import reserve_tag

          for commit in json.loads(os.environ['COMMITS']):
              try:
                  reserve_tag(os.environ['GITHUB_REPOSITORY'], commit)
              except RuntimeError as error:
                  # Publication retries with the existing permission diagnostic.
                  print(f'::warning::{error}')
          PY

  client:
    name: Client builds
    needs: plan
    if: needs.plan.outputs.release_clients == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/client-release.yml
    with:
      commits: ${{ needs.plan.outputs.commits }}
      matrix: ${{ needs.plan.outputs.client_matrix }}

  server:
    name: Server builds
    needs: plan
    if: needs.plan.outputs.build_server == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/server-image.yml

  client_publish:
    name: Publish checked client releases
    needs: [plan, checks, reserve, client]
    # A failed platform in one commit must not discard another complete commit.
    # The publisher validates a complete artifact set separately for every SHA.
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.checks.result == 'success' && needs.reserve.result == 'success' &&
      needs.plan.outputs.release_clients == 'true' &&
      (needs.client.result == 'success' || needs.client.result == 'failure')
    permissions:
      contents: write
    uses: ./.github/workflows/client-publish.yml
    with:
      commits: ${{ needs.plan.outputs.commits }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  server_publish:
    name: Publish checked server image
    needs: [plan, checks, server]
    if: >-
      needs.checks.result == 'success' && needs.server.result == 'success' &&
      needs.plan.outputs.build_server == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-publish.yml
