name: Publish server image

on:
  workflow_call:

permissions:
  contents: read

# Called only after the entrypoint's checks and both native builds pass.
jobs:
  publish:
    name: Publish multi-platform image
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: server-image-publication
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/images
          pattern: server-image-*
          merge-multiple: true
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Load and verify both staged images
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/server-image-$arch.tar"
            docker image inspect "$IMAGE:sha-$GITHUB_SHA-$arch" | jq -e \
              --arg arch "$arch" --arg commit "$GITHUB_SHA" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
                length == 1 and
                .[0].Os == "linux" and .[0].Architecture == $arch and
                .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
                .[0].Config.Labels["org.opencontainers.image.source"] == $source
              '
          done
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both platforms under the commit tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            tag="$IMAGE:sha-$GITHUB_SHA-$arch"
            docker push "$tag"
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
      - name: Promote latest without moving it backwards
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Read source labels on both native images, including older indexes.
          latest_commit=''
          if docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' > "$RUNNER_TEMP/latest-image.json" 2> "$RUNNER_TEMP/latest-image.err"; then
            latest_commit=$(jq -er '
              [if has("config") then . else .[] end
               | .config.Labels["org.opencontainers.image.revision"]]
              | unique
              | if length == 1 and (.[0] | type == "string" and test("^[a-f0-9]{40}$"))
                then .[0] else error("latest image must identify one source commit") end
            ' "$RUNNER_TEMP/latest-image.json")
          elif ! grep -Eiq 'manifest unknown|not found' "$RUNNER_TEMP/latest-image.err"; then
            cat "$RUNNER_TEMP/latest-image.err" >&2
            exit 1
          fi

          # Compare with the last published server, not simply the branch head.
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          history=$(git rev-list --first-parent "origin/$DEFAULT_BRANCH")
          if ! grep -Fxq "$GITHUB_SHA" <<< "$history"; then
            echo "Keeping latest: $GITHUB_SHA is no longer on the default branch."
          elif [ -z "$latest_commit" ] || ! grep -Fxq "$latest_commit" <<< "$history" || git merge-base --is-ancestor "$latest_commit" "$GITHUB_SHA"; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
            echo "Promoted $GITHUB_SHA to latest."
          else
            echo "Keeping latest at $latest_commit; $GITHUB_SHA cannot move it backwards."
          fi
