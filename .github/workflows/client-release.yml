name: Client releases

on:
  workflow_call:
    inputs:
      commits:
        description: 'JSON list of exact commits that passed every check'
        required: true
        type: string
      matrix:
        description: 'JSON client platform/commit build matrix'
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        required: false

permissions:
  contents: read

# Only ci.yml calls this workflow, after the complete checks matrix succeeds.
jobs:
  build:
    name: ${{ matrix.target }} at ${{ matrix.commit }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      TARGET: ${{ matrix.target }}
      COMMIT: ${{ matrix.commit }}
      # The explicit target prevents this flag from affecting host build tools.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore checked compilation and cache finished builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Same runner, target, toolchain, flags, and profile as checks.yml.
          # A distinct suffix lets builds save progress beyond the immutable test cache.
          key: rust-v2-${{ matrix.runner }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('Cargo.lock') }}-${{ matrix.commit }}-build
          restore-keys: |
            rust-v2-${{ matrix.runner }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('Cargo.lock') }}-${{ matrix.commit }}-
            rust-v2-${{ matrix.runner }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('Cargo.lock') }}-
            rust-v2-${{ matrix.runner }}-${{ matrix.target }}-1.98.1-release-
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Build client and standalone launcher
        run: cargo build --release --locked --target "$TARGET" -p rubblekin_client -p rubblekin_launcher
      - name: Log Linux runtime requirements
        if: runner.os == 'Linux'
        run: |
          ldd "target/$TARGET/release/rubblekin"
          ldd "target/$TARGET/release/rubblekin-launcher"
          readelf --version-info "target/$TARGET/release/rubblekin" | grep GLIBC_
      - name: Package native applications
        run: python scripts/release/package.py package --target "$TARGET" --binary-dir "target/$TARGET/release" --output-dir dist --commit "$COMMIT"
      - name: Verify extracted packages start
        run: python scripts/release/smoke.py --target "$TARGET" --directory dist
      - name: Verify launcher installs and starts the native client
        env:
          RUBBLEKIN_TEST_CLIENT_ARCHIVE: ${{ github.workspace }}/dist/rubblekin-client-${{ matrix.target }}.zip
        run: cargo test --release --locked --target "$TARGET" -p rubblekin_launcher --lib tests::installs_packaged_client_and_starts_help -- --ignored --exact
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.commit }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Android ARM64 at ${{ matrix.commit }}
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(inputs.commits) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      COMMIT: ${{ matrix.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          # The APK version code is this commit's full first-parent count.
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      # Historical commits predate Android. Their original desktop releases
      # remain buildable, while Android-capable commits require the APK.
      - name: Detect Android support at this exact commit
        id: android
        shell: bash
        run: |
          if test -f scripts/build_android.py; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.android.outputs.supported == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        if: steps.android.outputs.supported == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        if: steps.android.outputs.supported == 'true'
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        if: steps.android.outputs.supported == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: android-v1-1.98.1-ndk28-${{ hashFiles('Cargo.lock', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ matrix.commit }}
          restore-keys: |
            android-v1-1.98.1-ndk28-${{ hashFiles('Cargo.lock', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
            android-v1-1.98.1-ndk28-
      - name: Install pinned Android build tools
        if: steps.android.outputs.supported == 'true'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build and verify development APK
        if: steps.android.outputs.supported == 'true'
        shell: bash
        run: |
          android_args=()
          # Old Android commits lack both the updater and its metadata fields.
          if test -f android/app/src/main/java/net/rubblekin/client/LaunchActivity.java; then
            version_code="$(git rev-list --first-parent --count HEAD)"
            android/gradlew --no-daemon --console=plain -p android -PrubblekinVersionCode="$version_code" testDebugUnitTest
            android_args=(--android-updater --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --expected-version-code "$version_code")
          fi
          python scripts/build_android.py --output-dir dist
          signing_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/rubblekin-client-aarch64-linux-android.apk)"
          printf '%s\n' "$signing_output"
          # The updater requires one signer matching the stable public key.
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' <<< "$signing_output")" = 1
          grep -Fxq 'Signer #1 certificate SHA-256 digest: 36bf02be798e34ae69ed06c1533df861bf92bc9ca28126075556bd6bb82ffc90' <<< "$signing_output"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/rubblekin-client-aarch64-linux-android.apk
          python scripts/release/package.py android --apk dist/rubblekin-client-aarch64-linux-android.apk --output-dir dist --commit "$COMMIT" "${android_args[@]}"
      - uses: actions/upload-artifact@v7
        if: steps.android.outputs.supported == 'true'
        with:
          name: client-${{ matrix.commit }}-aarch64-linux-android
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Release ${{ matrix.commit }}
    needs: [build, android]
    # A failed build for one commit must not discard other complete commits.
    # A missing platform fails manifest assembly for that commit only.
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(inputs.commits) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: client-release-publication
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: client-${{ matrix.commit }}-*
          path: dist
          merge-multiple: true
      - name: Publish complete release and promote newest main commit
        env:
          # An optional repository-scoped token permits historical releases whose
          # workflow files differ from main (Contents + Workflows write).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT: ${{ matrix.commit }}
        run: |
          android_args=()
          if git cat-file -e "$COMMIT:scripts/build_android.py" 2>/dev/null; then
            android_args=(--android)
          fi
          if git cat-file -e "$COMMIT:android/app/src/main/java/net/rubblekin/client/LaunchActivity.java" 2>/dev/null; then
            android_args+=(--android-updater --expected-version-code "$(git rev-list --first-parent --count "$COMMIT")")
          fi
          python scripts/release/publish.py --directory dist --commit "$COMMIT" --repository "$GITHUB_REPOSITORY" "${android_args[@]}"
