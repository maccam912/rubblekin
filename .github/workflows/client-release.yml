name: Client builds

on:
  workflow_call:
    inputs:
      commits:
        description: 'JSON list of exact commits to build and validate'
        required: true
        type: string
      matrix:
        description: 'JSON client platform/commit build matrix'
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read

# Build alongside checks. ci.yml gates the separate publisher on their success.
jobs:
  build:
    name: ${{ matrix.target }} at ${{ matrix.commit }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Four jobs, with two on the 7 GB Apple Silicon runners.
      CARGO_BUILD_JOBS: ${{ matrix.target == 'aarch64-apple-darwin' && 2 || 4 }}
      CARGO_INCREMENTAL: 0
      TARGET: ${{ matrix.target }}
      COMMIT: ${{ matrix.commit }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
      CARGO_PROFILE_RELEASE_DEBUG: 1
      # The explicit target prevents this flag from affecting host build tools.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      # rust-cache retains dependencies; sccache pilots reusable local libraries
      # without duplicating the large dependency archive in its object cache.
      RUSTC_WORKSPACE_WRAPPER: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: rubblekin-workspace-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned compiler cache for Linux pilot
        if: runner.os == 'Linux'
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Cache release dependencies across commits
        uses: Swatinem/rust-cache@v2
        env:
          # rust-cache always hashes CARGO-prefixed variables; exclude this
          # scheduling knob only while the cache key is calculated.
          CARGO_BUILD_JOBS: ''
        with:
          prefix-key: rust-v3
          shared-key: ${{ matrix.runner }}-${{ matrix.target }}-release
          # Include compilation settings, without keying on Cargo's job count.
          env-vars: CARGO_INCREMENTAL CARGO_PROFILE CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET CARGO_TARGET RUST CC CFLAGS CXX CMAKE
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Build client and standalone launcher
        run: cargo build --release --locked --timings --target "$TARGET" -p rubblekin_client -p rubblekin_launcher
      - name: Upload client debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if test -n "$SENTRY_AUTH_TOKEN" && test -f scripts/release/sentry_symbols.py; then
            python scripts/release/sentry_symbols.py --binary-dir "target/$TARGET/release"
          fi
      - name: Log Linux runtime requirements
        if: runner.os == 'Linux'
        run: |
          ldd "target/$TARGET/release/rubblekin"
          ldd "target/$TARGET/release/rubblekin-launcher"
          readelf --version-info "target/$TARGET/release/rubblekin" | grep GLIBC_
      - name: Package native applications
        run: python scripts/release/package.py package --target "$TARGET" --binary-dir "target/$TARGET/release" --output-dir dist --commit "$COMMIT"
      - name: Verify extracted packages start
        run: python scripts/release/smoke.py --target "$TARGET" --directory dist
      - name: Verify launcher suite and native client installation
        env:
          RUBBLEKIN_TEST_CLIENT_ARCHIVE: ${{ github.workspace }}/dist/rubblekin-client-${{ matrix.target }}.zip
        run: cargo test --release --locked --target "$TARGET" -p rubblekin_launcher --lib -- --include-ignored
      - name: Report compiler cache hits for Linux pilot
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats
      - name: Upload native build timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-timings-${{ matrix.commit }}-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.commit }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Android ARM64 at ${{ matrix.commit }}
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(inputs.commits) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      COMMIT: ${{ matrix.commit }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUSTC_WORKSPACE_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: rubblekin-workspace-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          # The APK version code is this commit's full first-parent count.
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      # Historical commits predate Android. Their original desktop releases
      # remain buildable, while Android-capable commits require the APK.
      - name: Detect Android support at this exact commit
        id: android
        shell: bash
        run: |
          if test -f scripts/build_android.py; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Sentry upload credentials before compiling Android
        if: steps.android.outputs.supported == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if test -n "$SENTRY_AUTH_TOKEN" && test -f scripts/release/sentry_symbols.py; then
            npx --yes @sentry/cli@3.8.0 info
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.android.outputs.supported == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        if: steps.android.outputs.supported == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        if: steps.android.outputs.supported == 'true'
        with:
          python-version: '3.13'
      - name: Cache Gradle dependencies separately
        uses: gradle/actions/setup-gradle@v6
        if: steps.android.outputs.supported == 'true'
      - name: Install pinned compiler cache for Android pilot
        uses: mozilla-actions/sccache-action@v0.0.11
        if: steps.android.outputs.supported == 'true'
        id: sccache
        with:
          version: v0.16.0
      - name: Cache Android release dependencies across commits
        uses: Swatinem/rust-cache@v2
        if: steps.android.outputs.supported == 'true'
        env:
          CARGO_BUILD_JOBS: ''
        with:
          prefix-key: rust-v3
          shared-key: ubuntu-22.04-aarch64-linux-android-ndk28.2.13676358-release
          env-vars: CARGO_INCREMENTAL CARGO_PROFILE CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET CARGO_TARGET RUST CC CFLAGS CXX CMAKE
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache pinned cargo-ndk executable
        uses: actions/cache@v6
        if: steps.android.outputs.supported == 'true'
        with:
          path: ${{ runner.temp }}/cargo-ndk/bin
          key: cargo-ndk-ubuntu-22.04-${{ runner.arch }}-1.98.1-v4.1.2
      - name: Install pinned Android build tools
        if: steps.android.outputs.supported == 'true'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ! test -x "$RUNNER_TEMP/cargo-ndk/bin/cargo-ndk"; then
            cargo install cargo-ndk --version 4.1.2 --locked --root "$RUNNER_TEMP/cargo-ndk"
          fi
          echo "$RUNNER_TEMP/cargo-ndk/bin" >> "$GITHUB_PATH"
      - name: Build and verify development APK
        if: steps.android.outputs.supported == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          cargo ndk --version
          android_args=()
          # Old Android commits lack both the updater and its metadata fields.
          if test -f android/app/src/main/java/net/rubblekin/client/LaunchActivity.java; then
            version_code="$(git rev-list --first-parent --count HEAD)"
            android/gradlew --no-daemon --console=plain -p android -PrubblekinVersionCode="$version_code" testDebugUnitTest
            android_args=(--android-updater --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --expected-version-code "$version_code")
          fi
          python scripts/build_android.py --output-dir dist
          signing_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/rubblekin-client-aarch64-linux-android.apk)"
          printf '%s\n' "$signing_output"
          # The updater requires one signer matching the stable public key.
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' <<< "$signing_output")" = 1
          grep -Fxq 'Signer #1 certificate SHA-256 digest: 36bf02be798e34ae69ed06c1533df861bf92bc9ca28126075556bd6bb82ffc90' <<< "$signing_output"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/rubblekin-client-aarch64-linux-android.apk
          python scripts/release/package.py android --apk dist/rubblekin-client-aarch64-linux-android.apk --output-dir dist --commit "$COMMIT" "${android_args[@]}"
      - name: Report compiler cache hits for Android pilot
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        if: steps.android.outputs.supported == 'true'
        with:
          name: client-${{ matrix.commit }}-aarch64-linux-android
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
