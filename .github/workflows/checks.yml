name: Commit checks

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }} (${{ matrix.target || 'source' }})
    strategy:
      # All checks share a matrix so any failure cancels the other lanes.
      fail-fast: true
      matrix:
        include:
          - check: format
            runner: ubuntu-22.04
          - check: tooling
            runner: ubuntu-22.04
          - check: test
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - check: clippy
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      TARGET: ${{ matrix.target }}
      # Tests optimize simulation code without release LTO or large debug files.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.check != 'tooling'
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        if: matrix.check == 'tooling'
        with:
          python-version: '3.13'
      - name: Cache Rust check dependencies
        if: matrix.target != ''
        uses: Swatinem/rust-cache@v2
        env:
          # rust-cache always includes CARGO variables in its compiler key.
          CARGO_BUILD_JOBS: ''
        with:
          prefix-key: rust-v3
          shared-key: ${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.check }}
          # Profile/compiler inputs matter; compiler job count does not.
          env-vars: CARGO_PROFILE CARGO_BUILD_TARGET CC CFLAGS CXX CMAKE RUST
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux windowing dependencies
        if: runner.os == 'Linux' && matrix.target != ''
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Check formatting
        if: matrix.check == 'format'
        run: cargo fmt --all -- --check
      - name: Test release and pipeline tooling
        if: matrix.check == 'tooling'
        run: |
          python -m unittest discover -s scripts/release -v
          # Historical release commits may predate the pipeline planner.
          if [ -d scripts/ci ]; then python -m unittest discover -s scripts/ci -v; fi
      - name: Test workspace
        if: matrix.check == 'test'
        run: cargo test --workspace --locked --target "$TARGET" --timings
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings
      - name: Upload test compilation timings
        if: always() && matrix.check == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: check-timings-${{ inputs.commit }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
